<div class="filters" role="region" aria-label="Filter cards">
  <!-- Controls row: search + compact facets + sort + reset share one wrapping
       row, so the space beside the search box does real work on desktop. -->
  <div class="filters__controls">
    <input
      type="search"
      class="filters__search-input"
      [value]="searchTerm()"
      [placeholder]="searchPlaceholder()"
      [attr.aria-label]="searchPlaceholder()"
      (input)="onSearchInput($event)"
    />

    @for (group of inlineGroups(); track group.id) {
      <app-kanban-filter-group [group]="group" (toggled)="onToggle(group.id, $event)" />
    }

    @if (sortOptions().length > 0) {
      <div class="filters__sort">
        <span class="filters__label">Sort</span>
        @for (opt of sortOptions(); track opt.value) {
          <app-chip
            [active]="activeSort() === opt.value"
            (toggle)="sortChange.emit(opt.value)"
          >{{ opt.label }}</app-chip>
        }
      </div>
    }

    @if (hasActive()) {
      <button type="button" class="filters__reset" (click)="reset.emit()">
        Reset filters
      </button>
    }
  </div>

  <!-- Wide facets (project, epic) — one full-width wrapping row each. -->
  @for (group of wideGroups(); track group.id) {
    <app-kanban-filter-group [group]="group" (toggled)="onToggle(group.id, $event)" />
  }
</div>
