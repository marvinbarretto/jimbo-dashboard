<div class="report-notice" [class.report-notice--settled]="mode() === 'acked' || mode() === 'dismissed'">
  <p class="report-notice__lead">{{ question() }}</p>
  @if (hint()) {
    <p class="report-notice__meta">gates: {{ hint() }}</p>
  }

  @if (answerable()) {
    <app-answer-rail
      [options]="options()"
      [dismissible]="true"
      [state]="railState()"
      [ackMessage]="ackMessage()"
      dismissedMessage="Dismissed — Jimbo won't raise it again today."
      errorMessage="Couldn't reach Jimbo."
      (optionSelected)="sendOption($event)"
      (textSubmitted)="sendReply($event)"
      (dismissRequested)="dismiss()"
      (retryRequested)="retry()"
    />
  }
</div>
