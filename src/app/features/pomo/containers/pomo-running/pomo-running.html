<div class="running">
  <app-ui-card>
    <app-ui-stack gap="md" align="center">

      @if (projectName()) {
        <p class="running__project">{{ projectName() }}</p>
      }

      <div class="running__clock" [class.running__clock--expired]="isExpired()">
        {{ displayTime() }}
      </div>

      <div class="running__progress" role="progressbar" [attr.aria-valuenow]="progressPct()">
        <div class="running__progress-fill" [style.width.%]="progressPct()"></div>
      </div>

      @if (session()?.notes) {
        <p class="running__intention">{{ session()!.notes }}</p>
      }

      @if (isExpired()) {
        <app-ui-button variant="primary" (pressed)="finishEarly()">Save & finish</app-ui-button>
      } @else {
        <app-ui-cluster gap="sm" justify="center">
          <app-ui-button variant="primary" (pressed)="finishEarly()">Finish early</app-ui-button>
          <app-ui-button variant="ghost" (pressed)="abandon()">Abandon</app-ui-button>
        </app-ui-cluster>
      }

    </app-ui-stack>
  </app-ui-card>
</div>
