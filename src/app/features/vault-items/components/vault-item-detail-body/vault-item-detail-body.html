@if (store.isDraftMode()) {
  <div class="vault-item-detail vault-item-detail--draft">
    <header class="draft-form__header">
      <app-ui-inline-edit
        class="draft-form__title"
        [value]="store.draftPayload().title"
        size="lg"
        ariaLabel="Title"
        placeholder="Title — what is this about?"
        (saved)="store.setDraftTitle($event)"
      />
    </header>

    <div class="draft-form__body-wrap">
      <textarea
        class="draft-form__body"
        [appMention]="store.draftTriggers"
        [value]="store.draftPayload().body"
        (input)="onDraftBodyInput($event)"
        (keydown)="onDraftBodyKey($event)"
        placeholder="Notes — type # @ ~ for inline metadata. Shift+Enter for newline; Enter to save."
        rows="4"
        aria-label="Body"
      ></textarea>
    </div>

    <app-ui-mention-chip-strip
      class="draft-form__chips"
      [tags]="store.draftPayload().tags"
      [projects]="store.draftPayload().projects"
      [assignee]="store.draftPayload().assignee"
      [related]="store.draftPayload().related"
      (tagRemoved)="store.removeDraftTag($event)"
      (projectRemoved)="store.removeDraftProject($event)"
      (assigneeRemoved)="store.removeDraftAssignee()"
      (relatedRemoved)="store.removeDraftRelated($event)"
    />

    <footer class="draft-form__footer">
      @if (store.draftError(); as err) {
        <span class="draft-form__error">{{ err }}</span>
      } @else {
        <span class="draft-form__hint">
          <kbd>#</kbd>tag · <kbd>{{ '@' }}</kbd>actor/project · <kbd>~</kbd>related · <kbd>↵</kbd> save
        </span>
      }
      <app-ui-button
        size="sm"
        variant="primary"
        [disabled]="!store.canSubmitDraft()"
        (pressed)="submitDraft()">
        {{ store.draftSubmitting() ? 'Saving…' : 'Save' }}
      </app-ui-button>
    </footer>
  </div>
} @else if (store.item(); as item) {
  <div class="vault-item-detail">

    <app-vault-item-identity-header
      [item]="item"
      (titleChange)="store.updateTitle($event)"
    />

    <div class="vault-item-detail__zone2">
      <app-vault-item-status-chips
        [item]="item"
        [owner]="store.owner()"
        [lifecycle]="lifecycleOf(item)"
        [isArchived]="isItemArchived(item)"
        [effectivePriority]="store.effectivePriority()"
        [priorityDiverges]="store.priorityDiverges()"
        [firstProject]="store.projects()[0]"
        [isGitHubItem]="store.isGitHubItem()"
        [activeActors]="store.activeActors()"
        (statusChange)="store.setStatus($event)"
        (reassign)="store.reassign($event)"
        (epicToggle)="store.setEpic($event)"
      />

      <app-vault-item-meta-line
        [createdAt]="item.created_at"
        [lastActivityAt]="store.lastActivityAt()"
        [completedAt]="item.completed_at"
        [archivedAt]="item.archived_at"
        [dueAt]="item.due_at"
        [rationale]="item.ai_rationale"
        [rationaleExpanded]="store.rationaleExpanded()"
        (toggleRationale)="store.toggleRationale()"
      />

      <app-vault-item-overview-cards
        [source]="store.sourceSummary()"
        [hierarchy]="store.hierarchySummary()"
        [timeline]="store.timelineSummary()"
        [queue]="store.queueSummary()"
      />
    </div>

    @if (store.showRejectForm()) {
      <app-reject-form
        [itemId]="item.id"
        [currentOwner]="item.assigned_to"
        [recentEvents]="store.events()"
        [availableActors]="store.availableActors()"
        (cancelled)="store.closeReject()"
        (submitted)="onRejectSubmitted($event)"
      />
    }

    <app-vault-item-questions
      [questions]="store.openQuestions()"
      [vaultItemId]="item.id"
      [currentActor]="currentActorId"
      (replyPosted)="postThreadReply($event)"
    />

    <app-ui-section
      title="Body"
      [expanded]="store.sectionBody()"
      [meta]="'intake · delivery · links ' + (store.sectionBody() ? '▴' : '▾')"
      (toggled)="store.toggleSection('body')">
      <div class="vault-item-detail__body-layout">
        <app-vault-item-intake-block
          [body]="item.body"
          [createdAt]="item.created_at"
          [editable]="store.isManual()"
          (bodyChange)="store.updateBody($event)"
        />

        <app-vault-item-delivery-block
          [readiness]="store.readiness()"
          [criteria]="item.acceptance_criteria"
          [editable]="true"
          (criteriaChange)="store.updateCriteria($event)"
        />

        <app-vault-item-links-block
          [subtasks]="store.children()"
          [projects]="store.projects()"
          [activeProjects]="store.activeProjects()"
          [openBlockers]="store.openBlockers()"
          [tags]="item.tags"
          [addBlockerSeqInput]="store.addBlockerSeqInput()"
          [parent]="store.parentRef()"
          [editable]="true"
          (subtaskClicked)="swapToSeq($event)"
          (projectClicked)="onProjectClicked($event)"
          (projectAdded)="store.addProject($event)"
          (projectRemoved)="store.removeProject($event)"
          (blockerClicked)="swapToSeq($event)"
          (blockerRemoved)="store.removeBlocker($event)"
          (blockerAddBySeq)="store.addBlockerBySeq()"
          (blockerSeqInputChange)="store.addBlockerSeqInput.set($event)"
          (tagsChange)="store.updateTags($event)"
          (parentClicked)="swapToSeq($event)"
          (parentChange)="store.updateParent($event)"
        />
      </div>
    </app-ui-section>

    <app-ui-section
      title="Activity"
      tone="subtle"
      [expanded]="store.sectionActivity()"
      [meta]="'timeline · filters · ' + store.events().length + ' events ' + (store.sectionActivity() ? '▴' : '▾')"
      (toggled)="store.toggleSection('activity')">
      <app-activity-log
        [events]="store.events()"
        [actorLabel]="store.actorLabelFn"
        [actorKind]="store.actorKindFn"
      />
    </app-ui-section>

    <app-ui-section
      title="Thread"
      tone="subtle"
      [expanded]="store.sectionThread()"
      [meta]="'conversation · ' + store.messages().length + ' messages ' + (store.sectionThread() ? '▴' : '▾')"
      (toggled)="store.toggleSection('thread')">
      <app-thread-view
        [vaultItemId]="item.id"
        [currentActor]="currentActorId"
        [actorMap]="store.actorMap()">
      </app-thread-view>
    </app-ui-section>

    <app-vault-item-action-bar
      [editRoute]="['/vault-items', item.seq, 'edit']"
      [canReject]="store.canReject()"
      [isArchived]="isItemArchived(item)"
      (rejected)="store.openReject()"
      (archived)="store.archive()"
      (deleted)="onDeleted()"
    />

  </div>
} @else {
  <div class="vault-item-not-found">
    <a routerLink="/vault-items" class="back-link">← Vault</a>
    <p>Item not found.</p>
  </div>
}
