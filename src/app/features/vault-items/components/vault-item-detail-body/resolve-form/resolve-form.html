<form class="resolve-form" [formGroup]="form" (ngSubmit)="submit()">
  <h3 class="resolve-form__title">Archive with a note</h3>

  <label class="resolve-form__field">
    <span class="resolve-form__label">What happened? (≥ 12 chars, supports markdown)</span>
    <textarea
      formControlName="message"
      rows="4"
      class="resolve-form__textarea"
      placeholder="Why is this fine now? Goes on the thread and the archive record, so a future reader can tell done from abandoned."
    ></textarea>
    @if (form.controls.message.touched && form.controls.message.invalid) {
      <span class="resolve-form__error">A message is required and must be at least 12 characters.</span>
    }
  </label>

  <div class="resolve-form__actions">
    <button type="button" class="resolve-form__cancel" (click)="cancel()">Cancel</button>
    <button type="submit" class="resolve-form__submit" [disabled]="form.invalid">
      Archive with a note
    </button>
  </div>
</form>
