<app-modal-shell [titleId]="titleId" closeLabel="Close detail" [showHeader]="false" (close)="onClose()">
  <h2 modal-header [id]="titleId" class="dialog-headline">{{ headline() }}</h2>
  <app-vault-item-detail-body
    [mode]="mode()"
    surface="modal"
    (modeChange)="onModeChange($event)"
  />
</app-modal-shell>
