@if (loading()) {
  <app-ui-loading-state message="Loading training…" />
} @else {
  <app-ui-stack gap="lg">
    <!-- Patterns over time: day / week / month -->
    <app-ui-section title="Totals">
      <app-ui-period-totals [measures]="totalsMeasures" [daily]="dailyTotals()" [anchor]="today" />
    </app-ui-section>

    <!-- Trend: training volume per day -->
    <app-ui-section title="Volume per day">
      @if (hasTrend()) {
        <app-ui-bar-chart [labels]="trendLabels()" [values]="trendValues()" label="volume" suffix=" kg" />
      } @else {
        <app-ui-empty-state message="No sessions in the last 14 days." />
      }
    </app-ui-section>

    <!-- Day-grouped workout ledger: sessions expand to editable sets/cardio -->
    @for (d of days(); track d.date) {
      <app-ui-section [title]="d.label" [meta]="dayMeta(d)" [expanded]="isDayOpen(d.date)" (toggled)="toggleDay(d.date)">
        <div class="exercise-ledger">
          @for (s of d.sessions; track s.id) {
            <app-exercise-session-row
              [session]="s"
              [editable]="true"
              [exerciseOptions]="exerciseOptions()"
              (sessionPatch)="onSessionPatch($event)"
              (sessionRemove)="onSessionRemove($event)"
              (childPatch)="onChildPatch($event)"
              (childRemove)="onChildRemove($event)"
              (addSet)="onAddSet($event)"
            />
          } @empty {
            <p class="exercise-ledger__empty">No workout logged this day.</p>
          }

          <app-ui-button class="exercise-ledger__add" variant="secondary" size="sm" (pressed)="addSession(d.date)">
            + Log a workout
          </app-ui-button>
        </div>
      </app-ui-section>
    }
  </app-ui-stack>
}
