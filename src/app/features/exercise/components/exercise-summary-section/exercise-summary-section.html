<app-ui-section title="Exercise" [meta]="sectionMeta()" [expanded]="open()" (toggled)="open.set(!open())">
  @if (loading()) {
    <app-ui-loading-state message="Loading workouts…" />
  } @else if (!hasAny()) {
    <app-ui-empty-state message="No workouts or activity logged in this period." />
  } @else {
    <app-ui-stack gap="lg">
      <div class="exercise-summary__stats">
        <app-ui-stat-card label="Workouts" [value]="totals().sessions.toString()" />
        <app-ui-stat-card label="Sets" [value]="totals().sets.toString()" />
        <app-ui-stat-card label="Volume" [value]="totals().volumeKg.toString()" detail="kg" />
        <app-ui-stat-card label="Steps" [value]="activityTotals().steps.toLocaleString()" />
        <app-ui-stat-card label="Distance" [value]="activityTotals().distanceKm.toString()" detail="km" />
      </div>

      @if (hasData()) {
        <app-ui-bar-chart
          [labels]="dayLabels()"
          [values]="volumeByDay()"
          label="volume"
          suffix=" kg"
          accent="rgba(96, 165, 250, 0.7)"
        />
      }
    </app-ui-stack>
  }
</app-ui-section>
