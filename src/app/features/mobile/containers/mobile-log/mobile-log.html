@if (loading()) {
  <app-ui-loading-state message="Loading today…" />
} @else if (loadFailed()) {
  <div class="log__error">
    <p class="log__error-message">Couldn't load today's log.</p>
    <app-ui-button variant="secondary" (pressed)="retry()">Try again</app-ui-button>
  </div>
} @else {
  <!-- No page heading: the tab bar already says Log, and the group renders its
       own "Today · n entries · 1,840 kcal" line. A second title would just cost
       a thumb-scroll. Sheet-vs-inline editing is the group's own call. -->
  <app-ui-tracker-day-group
    [date]="today()"
    [entries]="entries()"
    [measures]="ledgerMeasures"
    [editable]="true"
    [quickAddMeasures]="quickAdd"
    [quickAddSuggestions]="suggestions()"
    [quickAddAllowCreate]="true"
    [quickAddInstantCommit]="true"
    quickAddPlaceholder="what did you eat or drink?"
    quickAddLabel="Add"
    quickAddKind="food"
    emptyMessage="Nothing logged yet today."
    (add)="ledger.addFood($event)"
    (patch)="ledger.patch($event)"
    (remove)="ledger.remove($event)"
  />

  @if (hasWeek()) {
    <section class="log__week" aria-label="Calories, last 7 days">
      <h2 class="log__week-title">Last 7 days</h2>
      <app-ui-bar-chart [labels]="week().labels" [values]="week().values" suffix=" kcal" [height]="130" />
    </section>
  }
}
