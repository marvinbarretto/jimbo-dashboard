<app-ui-page width="wide">
<app-ui-period-pager
  [granularity]="pager.granularity"
  eyebrow="Nutrition"
  [title]="pager.window().label"
  [isAtToday]="pager.isAtToday()"
  [value]="pager.key()"
  (previous)="pager.previous()"
  (next)="pager.next()"
  (today)="pager.today()"
  (dateChange)="pager.onDateChange($event)"
/>

<!-- The scanner is a phone-first flow, so it gets a plain link rather than a
     slot in the pager: on desktop it's a curiosity, on mobile it's the point. -->
<p class="nutrition__scan-link">
  <a routerLink="/nutrition/scan">Scan a barcode →</a>
</p>

@if (loading()) {
  <app-ui-loading-state message="Loading nutrition…" />
} @else {
  <app-ui-stack gap="lg">
    <!-- Patterns over time: day / week / month totals with targets -->
    <app-ui-section title="Totals" [collapsible]="false">
      <app-ui-period-totals
        [measures]="totalsMeasures"
        [daily]="dailyTotals()"
        [targets]="targets"
        [period]="granularity"
        [anchor]="pager.window().start"
        [today]="todayIso"
        [showToggle]="false"
      />
    </app-ui-section>

    <!-- Trend: calories per day — food vs alcohol (not shown for a single-day window) -->
    @if (pager.showPatterns()) {
      <app-ui-section title="Calories per day — food vs alcohol" [collapsible]="false">
        @if (hasTrend()) {
          <app-ui-bar-chart
            [labels]="trendLabels()"
            [series]="trendSeries()"
            suffix=" kcal"
            [showTrend]="true"
          />
        } @else {
          <app-ui-empty-state message="No entries in this window." />
        }
      </app-ui-section>
    }

    <!-- Quick supplement log: today by default; silently backdated to the
         viewed day when browsing a specific past day (see supplementDefaultDate) -->
    @if (supplementOptions().length) {
      <app-ui-section title="Log a supplement" [collapsible]="false">
        <app-ui-quick-add-row
          [options]="supplementOptions()"
          [measures]="suppQuickAdd"
          [defaultDate]="supplementDefaultDate()"
          placeholder="pick a supplement…"
          labelAria="Supplement"
          addLabel="Log"
          kind="supplement"
          (add)="onAddSupplement($event)"
        />
      </app-ui-section>
    }

    <!-- The unified day ledger: food + supplements, edit-in-place + quick-add -->
    @for (d of days(); track d.date) {
      <app-ui-tracker-day-group
        [date]="d.date"
        [entries]="d.entries"
        [measures]="ledgerMeasures"
        [editable]="true"
        [expanded]="d.date === todayIso"
        [quickAddMeasures]="foodQuickAdd"
        [quickAddSuggestions]="foodSuggestions()"
        [quickAddAllowCreate]="true"
        [quickAddInstantCommit]="true"
        quickAddPlaceholder="what did you eat or drink?"
        quickAddLabel="Add"
        quickAddKind="food"
        emptyMessage="Nothing logged this day yet."
        (add)="onAddFood($event)"
        (patch)="onPatch($event)"
        (remove)="onRemove($event)"
      />
    }
  </app-ui-stack>
}
</app-ui-page>
