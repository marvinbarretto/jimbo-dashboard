<app-ui-page width="full">
@if (loading()) {
  <app-ui-loading-state message="Loading briefing…" />
} @else if (error()) {
  <app-ui-empty-state title="Couldn't load briefing" [message]="error()!" />
} @else if (briefing(); as b) {
  <app-ui-stack gap="lg">
    <app-ui-page-header>
      <h1 uiPageHeaderTitle>{{ b.session === 'morning' ? '☀️' : '◀️' }} {{ b.session | titlecase }} briefing</h1>
      <p uiPageHeaderHint>{{ b.generated_at | date: 'EEEE d MMMM, HH:mm' }} · {{ b.model }}</p>
    </app-ui-page-header>

    <div class="briefing-detail__cols">
      <app-briefing-report [analysis]="b.analysis" [briefingId]="b.id" [hideSuggestedBlocks]="true" />
      <div class="briefing-detail__side">
        <app-calendar-board [briefingId]="b.id" [suggestedBlocks]="b.analysis.suggested_blocks ?? []" />
        <app-watch-queue-panel />
        @if (reviewDay(); as day) {
          <app-actor-activity [day]="day" />
        }
      </div>
    </div>
  </app-ui-stack>
} @else {
  <app-ui-empty-state title="Briefing not found" message="This briefing may have been removed." />
}
</app-ui-page>
