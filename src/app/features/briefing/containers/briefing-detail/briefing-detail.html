@if (loading()) {
  <app-ui-loading-state message="Loading briefing…" />
} @else if (error()) {
  <app-ui-empty-state title="Couldn't load briefing" [message]="error()!" />
} @else if (briefing(); as b) {
  <app-ui-stack gap="lg">
    <app-ui-page-header>
      <h1 uiPageHeaderTitle>{{ b.session === 'morning' ? '☀️' : '◀️' }} {{ b.session | titlecase }} briefing</h1>
      <p uiPageHeaderHint>{{ b.generated_at | date: 'EEEE d MMMM, HH:mm' }} · {{ b.model }}</p>
    </app-ui-page-header>

    <app-briefing-report [analysis]="b.analysis" />

    <app-ui-section title="Your rating" [collapsible]="false">
      <app-briefing-rating
        [rating]="b.rating"
        [note]="b.rating_note"
        [pending]="isSaving(b.id)"
        (rate)="onRate(b, $event)" />
    </app-ui-section>
  </app-ui-stack>
} @else {
  <app-ui-empty-state title="Briefing not found" message="This briefing may have been removed." />
}
