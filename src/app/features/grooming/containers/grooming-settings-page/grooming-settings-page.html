<app-ui-stack gap="lg">
  <app-ui-page-header>
    <app-ui-back-link uiPageHeaderLead [to]="['/grooming']">← Grooming</app-ui-back-link>
    <h1 uiPageHeaderTitle>Grooming settings</h1>
  </app-ui-page-header>

  @if (loading()) {
    <app-ui-loading-state message="Loading…" />
  } @else {
    <app-ui-section title="GitHub issue assessment" [collapsible]="false">
      <p class="grooming-settings-hint">
        When a GitHub issue is promoted (labeled <code>jimbo</code>), it's queued for a
        grooming assessment. This controls who runs that assessment and with which skill.
      </p>
      <app-ui-stack gap="md" class="grooming-settings-form">
        <label class="grooming-settings-field">
          <span class="grooming-settings-field__label">Assessment executor</span>
          <select class="grooming-settings-field__select" [value]="executor()" (change)="onExecutorChange($event)">
            @for (opt of executorOptions; track opt) {
              <option [value]="opt">{{ opt }}</option>
            }
          </select>
        </label>

        <label class="grooming-settings-field">
          <span class="grooming-settings-field__label">Assessment skill</span>
          <input
            class="grooming-settings-field__input"
            type="text"
            [value]="skill()"
            (change)="onSkillChange($event)"
            placeholder="vault-grooming/analyse"
          />
        </label>
      </app-ui-stack>
    </app-ui-section>

    <app-ui-button variant="primary" [disabled]="!dirty() || saving()" (pressed)="save()">
      {{ saving() ? 'Saving…' : 'Save' }}
    </app-ui-button>
  }
</app-ui-stack>
