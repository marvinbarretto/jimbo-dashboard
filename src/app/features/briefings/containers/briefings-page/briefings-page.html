<app-ui-page-header>
  <h1 uiPageHeaderTitle>Briefings</h1>
  <p uiPageHeaderHint>{{ headerHint() }}</p>
  <div uiPageHeaderActions>
    <button type="button" class="briefings__refresh" (click)="reload()">Refresh</button>
  </div>
</app-ui-page-header>

<section class="briefings__body">
  @if (loading() && briefings().length === 0) {
    <app-ui-loading-state message="Loading briefings…" />
  } @else if (error()) {
    <app-ui-empty-state title="Couldn’t load briefings" [message]="error()!" />
  } @else {
    <app-ui-data-table
      ariaLabel="Briefings"
      caption="Every generated briefing and your feedback rating."
      [columns]="columns"
      [data]="briefings()"
      emptyTitle="No briefings yet"
      emptyMessage="Briefings appear here once the morning/afternoon cron has run." />
  }
</section>

<ng-template #ratingCell let-context>
  <app-briefing-rating
    [rating]="context.getValue()"
    [note]="context.row.original.rating_note"
    [pending]="isSaving(context.row.original.id)"
    (rate)="onRate(context.row.original, $event)" />
</ng-template>

<ng-template #linkCell let-context>
  <a class="briefings__link" [routerLink]="['/briefing', context.getValue()]">View →</a>
</ng-template>
