<div class="answer-composer">
  <app-smart-composer-input
    [formControl]="answerControl"
    placeholder="Answer this…"
    ariaLabel="Clarification answer"
    (keydown.meta.enter)="submit()"
    (keydown.ctrl.enter)="submit()"
  />
  <div class="answer-composer__toolbar">
    <button type="button" class="answer-composer__send" [disabled]="answerControl.invalid" (click)="submit()">
      answer ↩
    </button>
  </div>
</div>
